name: ci
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary, so this job needs no Rust toolchain at all. Pinned to the
      # version used locally so CI and a developer's machine agree on what counts as a
      # typo. Configured by typos.toml at the repo root.
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@1.48.0
      - run: typos

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary rather than `cargo install`, which would rebuild nextest from
      # source on every run. Pinned to the version used locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138

      # Split from the e2e step below so a rendering regression is attributable at a
      # glance instead of being buried in the full run. `-E 'not binary(...)'` keeps
      # the two disjoint, so nothing runs twice and both share one compile.
      - name: unit + integration
        run: cargo nextest run --workspace --profile ci -E 'not binary(ansi_e2e)'

      - name: e2e (terminal rendering)
        run: cargo nextest run -p pore --test ansi_e2e --profile ci

      # nextest has no doctest runner, so `cargo nextest run` alone is a WEAKER gate
      # than `cargo test`. pore-core has a doctest (language.rs, LanguageRef); without
      # this step it would silently stop being checked.
      - name: doctests
        run: cargo test --workspace --doc

      # pore-lua's #[mlua::lua_module] entry point -- the exported get_index /
      # get_file_index bindings -- only compiles under mlua's `module` feature, which is
      # mutually exclusive with the default `vendored`. So every other job here silently
      # skips it, and the actual shipped Lua module can fail to compile while CI is
      # green. That happened: add41ce landed a call with a phantom 5th argument and
      # nothing noticed. This step is the only thing type-checking that code.
      - name: build the Lua module (cfg-gated out of every other job)
        run: cargo build -p pore-lua --no-default-features --features lua55,module
