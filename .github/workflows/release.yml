name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --verbose
        env:
          RUST_BACKTRACE: 1

  version-check:
    name: version check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version = ' pore-bin/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version v${TAG_VERSION} does not match pore-bin/Cargo.toml version v${CARGO_VERSION}"
            exit 1
          fi
          echo "Versions match."

  build:
    name: build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p pore --target ${{ matrix.target }}
        shell: bash

      - name: Package artifacts
        run: |
          mkdir -p dist
          # Determine binary name
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="pore.exe"
          else
            BIN_NAME="pore"
          fi
          # Copy binary, README, LICENSE into staging dir
          STAGE="dist/pore-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          # Generate SHA256 checksum
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" "pore-${{ matrix.target }}" > /dev/null
            certutil -hashfile "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" SHA256 | findstr /v "SHA256" | findstr /v "certutil" > "pore-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256"
          else
            tar czf "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" "pore-${{ matrix.target }}"
            sha256sum "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" > "pore-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256"
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pore-${{ matrix.target }}
          path: dist/pore-${{ matrix.target }}.*
          retention-days: 1

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          keep_files: true

  release:
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, build, rustdoc]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release body
        id: body
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            BODY="Initial release"
          else
            BODY=$(git log --oneline "$PREV_TAG..HEAD")
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.body.outputs.body }}
          files: dist/**/*
          draft: false
          prerelease: false
