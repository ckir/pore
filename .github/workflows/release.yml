name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --verbose
        env:
          RUST_BACKTRACE: 1

  version-check:
    name: version check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version = ' pore-bin/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version v${TAG_VERSION} does not match pore-bin/Cargo.toml version v${CARGO_VERSION}"
            exit 1
          fi
          echo "Versions match."

  build:
    name: build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [quality, version-check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, macos-26-intel, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p pore --target ${{ matrix.target }}
        shell: bash

      - name: Package artifacts
        run: |
          mkdir -p dist
          BIN_NAME="pore"
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN_NAME="pore.exe"
          STAGE="dist/pore-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
        shell: bash

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path "pore-${{ matrix.target }}" -DestinationPath "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" -Force
          $hash = Get-FileHash -Algorithm SHA256 -Path "pore-${{ matrix.target }}.${{ matrix.archive_ext }}"
          "$($hash.Hash) pore-${{ matrix.target }}.${{ matrix.archive_ext }}" | Out-File -FilePath "pore-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256" -Encoding utf8
        shell: pwsh

      - name: Package for Unix
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar czf "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" "pore-${{ matrix.target }}"
          sha256sum "pore-${{ matrix.target }}.${{ matrix.archive_ext }}" > "pore-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pore-${{ matrix.target }}
          path: dist/pore-${{ matrix.target }}.*
          retention-days: 1

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          keep_files: true

  release:
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, build, rustdoc]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release body
        id: body
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          case "$GITHUB_REF" in refs/tags/v*) IS_TAG=1;; *) IS_TAG=0;; esac
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          # Prefer the hand-written CHANGELOG section for this version, so releases read
          # as notes rather than a wall of commit subjects.
          #
          # Matched by literal prefix, not regex: awk mangles the bracket escapes in
          # "^## \[$ver\]" and silently matches nothing. Including the closing bracket in
          # the needle is what stops "0.3" from matching "## [0.3.0]".
          # The sed/tac/sed/tac pair trims leading and trailing blank lines.
          BODY=""
          if [ "$IS_TAG" = "1" ]; then
            BODY=$(awk -v ver="$VERSION" '
              BEGIN { want = "## [" ver "]" }
              index($0, want) == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)
          fi

          # Never ship an empty body. Falls back to the commit list for a
          # workflow_dispatch run, or a tag whose version has no CHANGELOG section.
          if [ -z "$BODY" ]; then
            if [ -n "$PREV_TAG" ]; then
              BODY=$(git log --oneline "$PREV_TAG..HEAD")
            else
              BODY="Initial release"
            fi
          fi

          if [ "$IS_TAG" = "1" ] && [ -n "$PREV_TAG" ]; then
            BODY="$BODY

          **Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}"
          fi

          # Random delimiter: a fixed one could appear in CHANGELOG prose and break the
          # heredoc, which is a known GITHUB_OUTPUT injection footgun.
          DELIM="body_$(openssl rand -hex 8)"
          echo "body<<$DELIM" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.body.outputs.body }}
          files: dist/**/*
          draft: false
          prerelease: false
