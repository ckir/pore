[package]
name = "pore"
version = "0.3.0"
edition = "2021"

# No crate-level README: the binary is documented by the workspace root README.md,
# which cargo cannot reference from here. A dangling `readme` key made `cargo package`
# (and therefore `cargo release`) fail.
license = "MIT"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.33"
mlua = { version = "0.12.0", features = ["async", "macros", "lua55", "vendored"] }
serde = "1.0.229"
serde_json = "1.0.151"
tantivy = "0.26.1"
termcolor = "1.4.1"
toml = "1.1.4+spec-1.1.0"
macros = { path = "../macros" }
pore-core = { path = "../pore-core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[[bin]]
name = "pore"
path = "src/main.rs"
