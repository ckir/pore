[package]
name = "pore-core"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = { version = "0.4.45", features = ["serde"] }
ignore = "0.4.33"
mlua = { version = "0.12.0", features = ["async", "macros"] }
serde = "1.0.229"
serde_json = "1.0.151"
tantivy = "0.26.1"
macros = { path = "../macros" }

[dev-dependencies]
tempfile = "3.27.0"

[features]
vendored = ["mlua/vendored", "mlua/lua54"]
